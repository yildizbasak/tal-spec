name: CI Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint
        run: node --check script.js && node --check framing.js
        
      - name: Test
        run: node --test tests/*.test.js
        
      - name: Build
        run: echo "Build işlemi yapılıyor..."